name: Debug BDA

on:
  push:
    branches: ["debug/**"]

jobs:
  bda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers ninja-build gdb
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build build --target agc_driver_bda_device_tests
      - run: dpkg -l mesa-vulkan-drivers libvulkan1 | tail -2; ls /usr/share/vulkan/icd.d
      - name: Default
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: ./build/tests/agc_driver_bda_device_tests || echo "exit $?"
      - name: Variant APS5_DBG_PROBE_ZERO
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          APS5_DBG_PROBE_ZERO: 1
        run: ./build/tests/agc_driver_bda_device_tests 2>&1 | grep -E "bits=32|passed|failed|incorrect|not published|substitute" || echo "exit $?"
      - name: Variant APS5_DBG_NO_STOP
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          APS5_DBG_NO_STOP: 1
        run: ./build/tests/agc_driver_bda_device_tests 2>&1 | grep -E "bits=32|passed|failed|incorrect|not published|substitute" || echo "exit $?"
      - name: Variant APS5_DBG_VOLATILE_WIDE
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          APS5_DBG_VOLATILE_WIDE: 1
        run: ./build/tests/agc_driver_bda_device_tests 2>&1 | grep -E "bits=32|passed|failed|incorrect|not published|substitute" || echo "exit $?"
      - name: Variant APS5_DBG_NO_WIDE
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          APS5_DBG_NO_WIDE: 1
        run: ./build/tests/agc_driver_bda_device_tests 2>&1 | grep -E "bits=32|passed|failed|incorrect|not published|substitute" || echo "exit $?"
      - name: Byte reads forced
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          APS5_BDA_BYTE_READS: 1
        run: ./build/tests/agc_driver_bda_device_tests || echo "exit $?"
      - name: Backtrace
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: gdb -batch -ex run -ex bt -ex 'info registers' -ex 'x/16i $pc-32' ./build/tests/agc_driver_bda_device_tests 2>&1 | tail -n 80; true
